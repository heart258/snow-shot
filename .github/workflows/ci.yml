# Snow Shot CI 工作流 - 代码检查与构建验证
name: CI

on:
    push:
        branches:
            - main
            - master
            - "feature/**"
            - "fix/**"
    pull_request:
        branches:
            - main
            - master

env:
    RUST_BACKTRACE: 1

jobs:
    # 前端代码检查 (biome lint + format)
    lint:
        name: Frontend Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 10.8.1

            - name: Setup pnpm cache
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              continue-on-error: true

            # Excalidraw 是本地文件依赖，CI 中可能不存在，使用 --ignore-scripts 绕过
            - name: Install dependencies (fallback)
              if: ${{ failure() }}
              run: pnpm install --no-frozen-lockfile --ignore-scripts
              continue-on-error: true

            - name: Run biome check
              run: pnpm exec biome check ./src/

    # Rust 代码检查 (fmt + clippy + check)
    rust-check:
        name: Rust Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install system dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                    libwebkit2gtk-4.1-dev \
                    build-essential \
                    curl \
                    wget \
                    file \
                    libxdo-dev \
                    libssl-dev \
                    libayatana-appindicator3-dev \
                    librsvg2-dev \
                    libglib2.0-dev \
                    libgtk-3-dev \
                    libsoup-3.0-dev \
                    libjavascriptcoregtk-4.1-dev

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            - name: Check formatting
              working-directory: src-tauri
              run: cargo fmt --all -- --check

            - name: Clippy
              working-directory: src-tauri
              run: cargo clippy --all-targets -- -D warnings
              continue-on-error: true

            - name: Cargo check
              working-directory: src-tauri
              run: cargo check --all-targets

    # 前端构建验证
    frontend-build:
        name: Frontend Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 10.8.1

            - name: Setup pnpm cache
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install yarn
              run: npm install -g yarn

            # 准备 Excalidraw 依赖 (本地文件依赖)
            - name: Clone Excalidraw
              run: |
                  cd ..
                  git clone https://github.com/mg-chao/excalidraw.git
                  cd excalidraw
                  git checkout custom/master
              shell: bash

            - name: Cache yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.yarn/cache
                      ~/.cache/yarn
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install Excalidraw dependencies
              run: |
                  cd ../excalidraw
                  yarn install --frozen-lockfile
                  cd ../snow-shot
              shell: bash

            - name: Create .env file
              run: echo "PUBLIC_ONLINE_STATUS=true" > .env
              shell: bash

            - name: Install app dependencies
              run: pnpm install --frozen-lockfile

            - name: Build Excalidraw
              run: pnpm update:excalidraw

            - name: Build web
              run: pnpm build
